<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenJournX — Free Trading Journal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bgDark: '#0b0e14',
                        cardDark: '#131722',
                        borderDark: '#232936',
                        accent: '#3b82f6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bgDark text-gray-200 font-sans antialiased min-h-screen">

    <!-- Navbar -->
    <nav class="border-b border-borderDark bg-cardDark/80 backdrop-blur sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white">JX</div>
                <span class="font-bold text-lg tracking-tight text-white">OpenJourn<span class="text-blue-500">X</span></span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="exportData()" class="text-xs bg-gray-800 hover:bg-gray-700 border border-borderDark px-3 py-2 rounded-md transition">
                    Export JSON
                </button>
                <label class="text-xs bg-gray-800 hover:bg-gray-700 border border-borderDark px-3 py-2 rounded-md cursor-pointer transition">
                    Import JSON
                    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
                </label>
                <button onclick="toggleModal(true)" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-2 rounded-md shadow transition">
                    + Log Trade
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Dashboard -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- KPI Metrics Row -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-cardDark border border-borderDark p-5 rounded-xl">
                <p class="text-xs text-gray-400 uppercase tracking-wider">Net P&L</p>
                <h2 id="netPnl" class="text-2xl font-bold mt-1 text-white">$0.00</h2>
            </div>
            <div class="bg-cardDark border border-borderDark p-5 rounded-xl">
                <p class="text-xs text-gray-400 uppercase tracking-wider">Win Rate</p>
                <h2 id="winRate" class="text-2xl font-bold mt-1 text-white">0%</h2>
            </div>
            <div class="bg-cardDark border border-borderDark p-5 rounded-xl">
                <p class="text-xs text-gray-400 uppercase tracking-wider">Profit Factor</p>
                <h2 id="profitFactor" class="text-2xl font-bold mt-1 text-white">0.00</h2>
            </div>
            <div class="bg-cardDark border border-borderDark p-5 rounded-xl">
                <p class="text-xs text-gray-400 uppercase tracking-wider">Total Trades</p>
                <h2 id="totalTrades" class="text-2xl font-bold mt-1 text-white">0</h2>
            </div>
        </div>

        <!-- Equity Curve Chart -->
        <div class="bg-cardDark border border-borderDark p-6 rounded-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-semibold text-white">Cumulative Equity Curve</h3>
                <span class="text-xs text-gray-400">Auto-saved in browser</span>
            </div>
            <div class="h-64">
                <canvas id="equityChart"></canvas>
            </div>
        </div>

        <!-- Trade Log Table -->
        <div class="bg-cardDark border border-borderDark rounded-xl overflow-hidden">
            <div class="px-6 py-4 border-b border-borderDark flex justify-between items-center">
                <h3 class="font-semibold text-white">Trade History</h3>
                <button onclick="clearAll()" class="text-xs text-red-400 hover:underline">Reset Journal</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-900/50 text-gray-400 text-xs uppercase border-b border-borderDark">
                        <tr>
                            <th class="px-6 py-3">Date</th>
                            <th class="px-6 py-3">Symbol</th>
                            <th class="px-6 py-3">Side</th>
                            <th class="px-6 py-3">Setup / Tag</th>
                            <th class="px-6 py-3">Net P&L</th>
                            <th class="px-6 py-3">Notes</th>
                            <th class="px-6 py-3 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tradeTableBody" class="divide-y divide-borderDark">
                        <!-- Trades populate here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add Trade Modal -->
    <div id="tradeModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardDark border border-borderDark rounded-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-white">Log New Trade</h3>
                <button onclick="toggleModal(false)" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            <form id="tradeForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Date</label>
                        <input type="date" id="date" required class="w-full bg-bgDark border border-borderDark rounded-md px-3 py-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Symbol</label>
                        <input type="text" id="symbol" placeholder="e.g. BTCUSD, NQ" required class="w-full bg-bgDark border border-borderDark rounded-md px-3 py-2 text-sm text-white uppercase">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Side</label>
                        <select id="side" class="w-full bg-bgDark border border-borderDark rounded-md px-3 py-2 text-sm text-white">
                            <option value="LONG">LONG</option>
                            <option value="SHORT">SHORT</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Net P&L ($)</label>
                        <input type="number" step="0.01" id="pnl" placeholder="-50 or 120" required class="w-full bg-bgDark border border-borderDark rounded-md px-3 py-2 text-sm text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Strategy / Setup</label>
                    <input type="text" id="setup" placeholder="e.g. Breakout, FVG, Pullback" class="w-full bg-bgDark border border-borderDark rounded-md px-3 py-2 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Psychology & Notes</label>
                    <textarea id="notes" rows="2" placeholder="Followed rules? Mistakes made?" class="w-full bg-bgDark border border-borderDark rounded-md px-3 py-2 text-sm text-white"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="toggleModal(false)" class="px-4 py-2 text-sm text-gray-400 hover:text-white">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-md">Save Trade</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let trades = JSON.parse(localStorage.getItem('openjournx_trades')) || [];
        let chartInstance = null;

        // Set default date to today
        document.getElementById('date').valueAsDate = new Date();

        function toggleModal(show) {
            const modal = document.getElementById('tradeModal');
            modal.classList.toggle('hidden', !show);
            modal.classList.toggle('flex', show);
        }

        document.getElementById('tradeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newTrade = {
                id: Date.now(),
                date: document.getElementById('date').value,
                symbol: document.getElementById('symbol').value.toUpperCase(),
                side: document.getElementById('side').value,
                pnl: parseFloat(document.getElementById('pnl').value),
                setup: document.getElementById('setup').value || 'General',
                notes: document.getElementById('notes').value || '-'
            };
            trades.push(newTrade);
            trades.sort((a, b) => new Date(a.date) - new Date(b.date));
            saveAndRender();
            this.reset();
            document.getElementById('date').valueAsDate = new Date();
            toggleModal(false);
        });

        function deleteTrade(id) {
            trades = trades.filter(t => t.id !== id);
            saveAndRender();
        }

        function clearAll() {
            if (confirm('Delete all logged trades? Make sure to export a JSON backup first.')) {
                trades = [];
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('openjournx_trades', JSON.stringify(trades));
            updateMetrics();
            renderTable();
            renderChart();
        }

        function updateMetrics() {
            const total = trades.length;
            let net = 0, wins = 0, grossProfit = 0, grossLoss = 0;

            trades.forEach(t => {
                net += t.pnl;
                if (t.pnl > 0) {
                    wins++;
                    grossProfit += t.pnl;
                } else if (t.pnl < 0) {
                    grossLoss += Math.abs(t.pnl);
                }
            });

            const win
